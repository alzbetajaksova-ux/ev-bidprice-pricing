# Úloha 3.8: grid search hyperparametrov MCTS (č. 6.3.1, Obr. 6 a 7 článku). Nie je to E3:
# E3 (prínos ladenia bid-price) patrí Členovi B.
# Inštancia z článku: 12 slotov, 96 krokov, 24 očakávaných požiadaviek, 3 nabíjačky.
# Hodnotí sa na TRÉNINGOVÝCH seedoch, aby výber parametrov nevidel testovacie inštancie.

configuration: {n_slots: 12, n_steps: 96, expected_requests: 24.0}
train_instances: 30      # návod: 100 sekvencií, pri pomalom behu 30; 10 000 iterácií v Pythone trvá ~9 s/epizódu
methods: [mcts, hybrid_mcts]
# Mriežka z návodu (n_iter 100, 1000, 10 000; c 0,5-10; d_max 1, 3, 8, 15) doplnená o 10, 30, 300, 3000
n_iter: [10, 30, 100, 300, 1000, 3000, 10000]
depth: [1, 3, 8, 15]
c: [0.5, 1.0, 3.0, 6.0, 10.0]
reference_methods: [flat, bidprice]  # vodorovné čiary v grafe; flat sa učí na train 0-199
