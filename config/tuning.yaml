# Ladenie θ bid-price politiky (tuning.py, Člen B, E3), spúšťa run_experiments.py --tune.
# Návod: 10 behov × 100 vyhodnotení × 200 tréningových inštancií. Kvôli času (jedno vyhodnotenie
# na 200 inštanciách pri 24 slotoch ~4,5 min) Člen B použil znížený rozpočet nižšie, rovnaký pre
# CMA-ES, náhodné hľadanie aj mriežku (mriežka pri 60 vyhodnoteniach stihne 2^4 = 16 bodov).
# Seedy behov 0-4, tréningové inštancie 0-49. Výsledky: results/params/, results/tuning_<s>s.csv.
slots: [2, 3, 4, 8, 12, 24]
runs: 5
budget: 60
n_train: 50
